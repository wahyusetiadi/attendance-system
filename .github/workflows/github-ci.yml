name: Presensi PKK Frontend CI

on:
  push:
    branches:
      - development-salim

jobs:
  install:
    name: Run on the Salim's Laptop
    runs-on: [self-hosted, itn-edunusa-paud-kanzul-khairat-presensi-fe]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

  build:
    name: Build the project
    runs-on: [self-hosted, itn-edunusa-paud-kanzul-khairat-presensi-fe]

    needs: install

    steps:
      # - name: Checkout repository
      #   uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build the project
        env:
          NEXT_PUBLIC_API_URL: ${{env.NEXT_PUBLIC_API_URL}}
        run: npm run build
