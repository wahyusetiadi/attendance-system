version: "3.8"

services:
  itn-edunusa-paud-kanzul-khairat-fe-staging:
    image: itn-edunusa-paud-kanzul-khairat-fe-staging-img:latest
    container_name: itn-edunusa-paud-kanzul-khairat-fe-staging-ctr
    build:
      context: ../
      dockerfile: composer/docker/Dockerfile.staging
      args:
        NODE_ENV: ${NODE_ENV}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED}
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_TELEMETRY_DISABLED: ${NEXT_TELEMETRY_DISABLED}
    ports:
      - "127.0.0.1:3503:6006"
    restart: unless-stopped
    env_file:
      - env/staging/.env

    networks:
      - traefik

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.itn-edunusa-paud-kanzul-khairat-fe-staging.rule=Host(`staging-paud-kanzul-khairat-presensi.edunusa.co.id`)"
      - "traefik.http.routers.itn-edunusa-paud-kanzul-khairat-fe-staging.entrypoints=websecure"
      - "traefik.http.routers.itn-edunusa-paud-kanzul-khairat-fe-staging.tls=true"
      - "traefik.http.routers.itn-edunusa-paud-kanzul-khairat-fe-staging.tls.certresolver=mytlschallenge"
      - "traefik.http.services.itn-edunusa-paud-kanzul-khairat-fe-staging.loadbalancer.server.port=6006"
      # (jika backend kamu pakai prefix API seperti /api atau /graphql)
      # - "traefik.http.routers.itn-edunusa-paud-kanzul-khairat-fe-staging.middlewares=strip-prefix"
      # - "traefik.http.middlewares.strip-prefix.stripprefix.prefixes=/api"

networks:
  traefik:
    external: true
